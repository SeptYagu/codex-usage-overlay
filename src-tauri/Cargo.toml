[package]
name = "codex-usage-overlay"
default-run = "codex-usage-overlay"
version = "1.0.1"
description = "A lightweight Windows overlay for OpenAI Codex usage"
authors = ["Justin"]
edition = "2021"

[lib]
name = "codex_usage_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
dirs = "6.0"
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "UI_Notifications",
    "Data_Xml_Dom"
] }
sys-locale = "0.3.2"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
rodio = { version = "=0.22.2", default-features = false, features = [
    "playback",
    "symphonia-aac",
    "symphonia-mp3",
    "symphonia-isomp4",
    "symphonia-wav",
    "symphonia-pcm"
] }

[[bin]]
name = "codex-usage-updater"
path = "src/bin/portable_updater.rs"
