name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build Check (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Put LLVM on PATH (arm64)
        # ring compiles its C and assembly with clang for aarch64-pc-windows-msvc.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path -LiteralPath (Join-Path $llvm 'clang.exe'))) { throw 'clang is required to build ring for arm64.' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $llvm
          }

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        shell: pwsh
        run: npm ci

      - name: Packaging Regression Tests
        shell: pwsh
        run: ./scripts/Test-TauriRelease.ps1

      - name: Frontend Typecheck & Tests
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }

      - name: DSH Companion Offline Security Tests
        shell: pwsh
        run: |
          node --test integrations/dsh-bridge/test/*.test.js
          if ($LASTEXITCODE -ne 0) { throw 'DSH companion tests failed.' }
          ./scripts/Package-DshCompanion.ps1 -OutputDirectory "$env:RUNNER_TEMP/dsh-companion-check"

      - name: Rust Unit & Integration Tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked

      - name: Claude Renewal Process Tree Regression
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --bin claude-usage-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Claude bridge build failed.' }
          ./scripts/Test-ClaudeRenewProcessTree.ps1 -BridgePath src-tauri/target/debug/claude-usage-bridge.exe
