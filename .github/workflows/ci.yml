name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        shell: pwsh
        run: npm ci

      - name: Packaging Regression Tests
        shell: pwsh
        run: ./scripts/Test-TauriRelease.ps1

      - name: Frontend Typecheck & Tests
        shell: pwsh
        run: |
          npm run build
          npm test

      - name: DSH Companion Offline Security Tests
        shell: pwsh
        run: |
          node --test integrations/dsh-bridge/test/*.test.js
          if ($LASTEXITCODE -ne 0) { throw 'DSH companion tests failed.' }
          ./scripts/Package-DshCompanion.ps1 -OutputDirectory "$env:RUNNER_TEMP/dsh-companion-check"

      - name: Rust Unit & Integration Tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
