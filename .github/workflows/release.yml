name: Release portable overlay

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build portable archive
        shell: powershell
        run: .\scripts\Build-Portable.ps1 -OutputDirectory "$env:RUNNER_TEMP\codex-usage-release"

      - name: Verify release files
        shell: powershell
        run: .\scripts\Test-Portable.ps1 -OutputDirectory "$env:RUNNER_TEMP\codex-usage-release"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'codex-usage-release'
          $portableZip = Join-Path $releaseDirectory 'CodexUsageOverlay-Portable.zip'
          $checksums = Join-Path $releaseDirectory 'SHA256SUMS.txt'
          $exists = (gh release view $env:GITHUB_REF_NAME --json id 2>&1)
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $portableZip $checksums --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME `
              $portableZip $checksums `
              --verify-tag --generate-notes --title $env:GITHUB_REF_NAME `
              --notes 'Windows portable build / Windows 便携版。Download the ZIP and verify it with SHA256SUMS.txt.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
