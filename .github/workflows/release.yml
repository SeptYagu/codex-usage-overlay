name: Release overlay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.1.0-preview)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # Each architecture builds and runs its tests natively on its own runner.
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Put LLVM on PATH (arm64)
        # ring compiles its C and assembly with clang for aarch64-pc-windows-msvc.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path -LiteralPath (Join-Path $llvm 'clang.exe'))) { throw 'clang is required to build ring for arm64.' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $llvm
          }

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Packaging Regression Tests
        shell: pwsh
        run: ./scripts/Test-TauriRelease.ps1

      - name: Test and build Tauri app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed.' }
          node --test integrations/dsh-bridge/test/*.test.js
          if ($LASTEXITCODE -ne 0) { throw 'DSH companion tests failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          # NSIS and MSI ship every Cargo binary that exists at bundle time, so the
          # bridge helpers are built first.
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --bin claude-usage-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Claude bridge helper build failed.' }
          ./scripts/Test-ClaudeRenewProcessTree.ps1 -BridgePath src-tauri/target/release/claude-usage-bridge.exe
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --bin antigravity-usage-bridge
          if ($LASTEXITCODE -ne 0) { throw 'Antigravity bridge helper build failed.' }
          npm run tauri -- build --ci --bundles nsis,msi
          if ($LASTEXITCODE -ne 0) { throw 'Tauri release build failed.' }
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --bin codex-usage-updater
          if ($LASTEXITCODE -ne 0) { throw 'Portable updater helper build failed.' }

      - name: Package and verify Tauri release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $releaseTag = "${{ github.event.inputs.tag }}"
          if (-not $releaseTag) { $releaseTag = $env:GITHUB_REF_NAME }
          .\scripts\Build-TauriRelease.ps1 -Tag $releaseTag -Arch ${{ matrix.arch }} -OutputDirectory "$env:RUNNER_TEMP\codex-usage-release"
          # The DSH companion is architecture-independent; one job packages it.
          if ('${{ matrix.arch }}' -eq 'x64') {
            .\scripts\Package-DshCompanion.ps1 -OutputDirectory "$env:RUNNER_TEMP\codex-usage-release"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/codex-usage-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-parts

      - name: Merge architectures
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.inputs.tag }}"
          if (-not $releaseTag) { $releaseTag = $env:GITHUB_REF_NAME }
          $parts = Join-Path $env:RUNNER_TEMP 'release-parts'
          .\scripts\Merge-TauriRelease.ps1 -Tag $releaseTag `
            -InputDirectory @((Join-Path $parts 'release-x64'), (Join-Path $parts 'release-arm64')) `
            -OutputDirectory "$env:RUNNER_TEMP\codex-usage-release"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "${{ github.event.inputs.tag }}"
          if (-not $releaseTag) { $releaseTag = $env:GITHUB_REF_NAME }
          $releaseDirectory = Join-Path $env:RUNNER_TEMP 'codex-usage-release'
          $assets = @(Get-ChildItem -LiteralPath $releaseDirectory -File | ForEach-Object { $_.FullName })
          if ($assets.Count -lt 2) { throw 'Release assets are missing.' }
          gh release view $releaseTag --json id 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @assets --clobber
          } else {
            $previewArgs = @()
            if ($releaseTag -match '-') { $previewArgs = @('--prerelease', '--latest=false') }
            $notesArgs = @('--generate-notes')
            $notesPath = Join-Path $env:GITHUB_WORKSPACE "docs/releases/$releaseTag.md"
            if (Test-Path -LiteralPath $notesPath) { $notesArgs = @('--notes-file', $notesPath) }
            gh release create $releaseTag @assets --verify-tag @notesArgs --title $releaseTag @previewArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
